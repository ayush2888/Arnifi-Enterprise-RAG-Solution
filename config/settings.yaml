embedding:
  provider: bedrock
  model: amazon.titan-embed-text-v2:0
  dimension: 1024
  batch_size: 16

pinecone:
  index_name: arnifi-rag-titan
  namespace: ""
  metric: cosine
  cloud: aws
  region: us-east-1

llm:
  # Model ID overridden by BEDROCK_CHAT_MODEL env when set
  model: amazon.nova-lite-v1:0
  temperature: 0.2
  max_tokens: 1200

retrieval:
  top_k_initial: 20
  max_chunks_returned: 5
  max_chunks_per_source_url: 2

seeds:
  listing_pages:
    - https://arnifi.com/blog/
    - https://arnifi.com/blog/category/business-in-malaysia/
    - https://arnifi.com/blog/category/visa-services/
    - https://arnifi.com/blog/category/business-setup-cayman-island/

crawl:
  allowed_domains:
    - arnifi.com
  max_pages_per_listing: 50
  politeness:
    delay_seconds: 1.0
  request_timeout_seconds: 30
  max_retries: 3

chunk:
  max_tokens: 400
  overlap_tokens: 80

paths:
  state_db: data/state.sqlite
  artifacts_dir: data/artifacts
