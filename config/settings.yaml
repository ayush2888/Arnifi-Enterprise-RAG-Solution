crawl:
  allowed_domains:
    - arnifi.com
  # Category archives paginate correctly; main /blog/page/N does not.
  max_pages_per_listing: 80
  politeness:
    delay_seconds: 0.75
  request_timeout_seconds: 30
  max_retries: 3
  # Flush embed/upsert every N newly processed posts (keeps memory bounded).
  ingest_flush_every_posts: 20
  website:
    max_child_pages: 200
    denylist_prefixes:
      - /checkout
      - /cart
      - /account
      - /api/
      - /admin
      - /private
      - /cost-calculator
      - /arnifi-organogram
      - /aml-screener
      - /products/arnifi-docs
      - /products/free-aI-assistance
      - /products/affiliate-program
      - /career
      - /privacy-policy
      - /terms-conditions

chunk:
  max_tokens: 400
  overlap_tokens: 80
  # Guardrail for huge legal PDFs so Titan ingest cannot hang on one file
  max_chunks_per_file: 500

whatsapp:
  chat_type: group
  # Empty allowlist = all groups from Periskope are allowed
  chat_allowlist: []
  episode_gap_minutes: 30
  max_messages_per_episode: 40
  min_messages: 3
  message_page_size: 100
  chat_page_size: 100
  request_delay_seconds: 0.35

# RAG eval harness (Phase 2+). Judge fields reserved for Nova faithfulness later.
eval:
  max_cases: null
  temperature: 0
  generate: true
  judge_model: amazon.nova-lite-v1:0

paths:
  state_db: data/state.sqlite
  artifacts_dir: data/artifacts
