embedding:
  provider: bedrock
  model: amazon.titan-embed-text-v2:0
  dimension: 1024
  batch_size: 16

pinecone:
  index_name: arnifi-rag-titan
  namespace: ""
  metric: cosine
  cloud: aws
  region: us-east-1

llm:
  # Model ID overridden by BEDROCK_CHAT_MODEL env when set
  model: amazon.nova-lite-v1:0
  temperature: 0.2
  max_tokens: 1200

retrieval:
  top_k_initial: 20
  max_chunks_returned: 5
  max_chunks_per_source_url: 2
  # Exact PM#### hits bypass the per-URL cap (see diversify_chunks).
  exact_service_code_bypasses_url_cap: true
  # Cosine floor — off-topic queries abstain with no sources (0 = disabled).
  min_score: 0.45
  # Bundled PM#### / Title rescue index (Lambda-safe; rebuild after pricing sync).
  pricing_lexical_index: config/indexes/pricing_lexical.json

